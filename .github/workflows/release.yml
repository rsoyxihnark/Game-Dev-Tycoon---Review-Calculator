name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm ci

      - name: Install the browser the render check needs
        run: npx playwright install --with-deps chromium

      - name: Check the built-in stylesheet is current
        run: node tools/build-styles.mjs --check

      - name: Run the test suite
        run: npm test

      - name: Read the release state
        id: state
        run: |
          set -euo pipefail
          version="$(node tools/version.mjs)"
          subject="$(git log -1 --pretty=%s)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'subject<<GDT_EOF'
            printf '%s\n' "$subject"
            echo 'GDT_EOF'
            echo 'body<<GDT_EOF'
            git log -1 --pretty=%b
            echo 'GDT_EOF'
          } >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "The source is on v$version, which is already released. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the commit against the version it claims to ship
        env:
          VERSION: ${{ steps.state.outputs.version }}
          SUBJECT: ${{ steps.state.outputs.subject }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "APP_VERSION is '$VERSION', which is not major.minor.patch."; exit 1 ;;
          esac
          if printf '%s' "$SUBJECT" | grep -q '^\[no release\]'; then
            echo "Marked [no release]. The version gate below still decides whether v$VERSION ships."
            exit 0
          fi
          case "$SUBJECT" in
            "[$VERSION]"*) ;;
            *) echo "A commit that is not [no release] must start with [$VERSION]. It starts: $SUBJECT"; exit 1 ;;
          esac
          changed="$(git diff --name-only HEAD~1 HEAD || true)"
          if printf '%s\n' "$changed" | grep -qx 'GameDevTycoon_Calculator.html'; then
            if ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "This commit changes the calculator but leaves CHANGELOG.md untouched."
              echo "Add its entries, or mark the commit [no release] if nothing reaches a user."
              exit 1
            fi
          fi

      - name: Check the changelog carries the version
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qx "## $VERSION" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $VERSION' section, so v$VERSION cannot be published."
            exit 1
          fi
          if grep -qiE '^## +unreleased' CHANGELOG.md; then
            echo "CHANGELOG.md still carries an Unreleased heading."
            exit 1
          fi

      - name: Tag and publish
        if: steps.state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.state.outputs.version }}
          BODY: ${{ steps.state.outputs.body }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"
          notes=release-notes.md
          printf '%s\n' "$BODY" > "$notes"
          if ! grep -q '^- ' "$notes"; then
            awk '/^## '"$VERSION"'$/{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$notes"
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$notes" \
            GameDevTycoon_Calculator.html
